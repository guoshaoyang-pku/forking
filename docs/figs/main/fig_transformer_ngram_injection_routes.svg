<svg xmlns="http://www.w3.org/2000/svg" width="176mm" height="126.23mm" viewBox="0 0 976 700" role="img"><title>Three alternative n-gram injection routes in a Transformer block</title><desc>Token and position input remains outside the block. The input route enters before QKV and may be gated or ungated; V and y routes are alternative additive sites.</desc><defs>
<marker id="tni-a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="tni-g" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1B6B5F"/></marker>
<style>
.tni{font-family:Arial,Helvetica,sans-serif;fill:#1F1F1F}
.body{font-size:18px;font-weight:700}
.sub{font-size:15px;font-weight:400;fill:#6B6B6B}
.route-title{font-size:18px;font-weight:700;fill:#1B6B5F}
.route-sub{font-size:15px;font-weight:400;fill:#1B6B5F}
.label{font-size:16px;font-weight:400;fill:#1B6B5F}
.legend-title{font-size:15px;font-weight:700;fill:#6B6B6B;letter-spacing:1px}
.legend-text{font-size:15px;font-weight:400;fill:#333}
.box{fill:#FFFFFF;stroke:#333;stroke-width:2}
.block{fill:none;stroke:#C5C0B6;stroke-width:2}
.route-box{fill:#DDECE7;stroke:#1B6B5F;stroke-width:2.5}
.flow{fill:none;stroke:#333;stroke-width:2}
.inject{fill:none;stroke:#1B6B5F;stroke-width:2;stroke-dasharray:9 7}
.plus{fill:#FFF;stroke:#1B6B5F;stroke-width:2}
.plus-mark{stroke:#1B6B5F;stroke-width:2;stroke-linecap:round}
.legend{fill:#FCFBF8;stroke:#DDD8CF;stroke-width:1.5}
</style></defs><rect width="100%" height="100%" fill="#FFF"/><rect class="box" x="620" y="24" width="280" height="78" rx="10"/><text class="tni body" x="760" y="57" text-anchor="middle">Token + position</text><text class="tni sub" x="760" y="84" text-anchor="middle">representation xℓ</text><path class="flow" d="M760 102L760 213" marker-end="url(#tni-a)"/><rect class="block" x="506" y="170" width="470" height="400" rx="10"/><text class="tni body" x="530" y="205" text-anchor="start">Transformer block ℓ</text><rect class="box" x="620" y="245" width="280" height="58" rx="10"/><text class="tni body" x="760" y="281" text-anchor="middle">Q, K, V projection</text><path class="flow" d="M760 303L760 346" marker-end="url(#tni-a)"/><rect class="box" x="594" y="346" width="332" height="58" rx="10"/><text class="tni body" x="760" y="382" text-anchor="middle">Causal self-attention</text><path class="flow" d="M760 404L760 447" marker-end="url(#tni-a)"/><rect class="box" x="620" y="447" width="280" height="58" rx="10"/><text class="tni body" x="760" y="483" text-anchor="middle">MLP</text><path class="flow" d="M760 505L760 625" marker-end="url(#tni-a)"/><rect class="box" x="620" y="625" width="280" height="58" rx="10"/><text class="tni body" x="760" y="661" text-anchor="middle">Next Transformer block</text><rect class="route-box" x="34" y="195" width="304" height="72" rx="10"/><text class="tni route-title" x="186" y="226" text-anchor="middle">(a) input route</text><text class="tni route-sub" x="186" y="250" text-anchor="middle">gated / ungated</text><rect class="route-box" x="34" y="299" width="304" height="72" rx="10"/><text class="tni route-title" x="186" y="330" text-anchor="middle">(b) V route</text><text class="tni route-sub" x="186" y="354" text-anchor="middle">gated</text><rect class="route-box" x="34" y="403" width="304" height="72" rx="10"/><text class="tni route-title" x="186" y="434" text-anchor="middle">(c) y route</text><text class="tni route-sub" x="186" y="458" text-anchor="middle">gated</text><text class="tni label" x="450" y="220" text-anchor="middle">before QKV</text><text class="tni label" x="450" y="324" text-anchor="middle">before attention</text><text class="tni label" x="450" y="428" text-anchor="middle">after attention</text><path class="inject" d="M338 231H746" marker-end="url(#tni-g)"/><path class="inject" d="M338 335H746" marker-end="url(#tni-g)"/><path class="inject" d="M338 439H746" marker-end="url(#tni-g)"/><circle class="plus" cx="760" cy="231" r="14"/><path class="plus-mark" d="M753 231h14M760 224v14"/><circle class="plus" cx="760" cy="335" r="14"/><path class="plus-mark" d="M753 335h14M760 328v14"/><circle class="plus" cx="760" cy="439" r="14"/><path class="plus-mark" d="M753 439h14M760 432v14"/><rect class="legend" x="34" y="520" width="304" height="130" rx="9"/><text class="tni legend-title" x="56" y="549" text-anchor="start">LEGEND</text><path class="inject" d="M56 579H112" marker-end="url(#tni-g)"/><text class="tni legend-text" x="132" y="584" text-anchor="start">n-gram injection</text><circle class="plus" cx="78" cy="614" r="14"/><path class="plus-mark" d="M71 614h14M78 607v14"/><text class="tni legend-text" x="132" y="619" text-anchor="start">additive injection point</text><text class="tni sub" x="56" y="643" text-anchor="start">one route enabled per run</text></svg>
