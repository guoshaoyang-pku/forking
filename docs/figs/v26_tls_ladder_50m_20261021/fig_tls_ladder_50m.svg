<title id="fig-title">50M table-LR ladder: forking gap collapse, E3 benefit, and the E1 cost</title>
<desc id="fig-desc">Three panels over table LR 1x, 0.5x, 0.25x at R/N 16 and 32 show E3 own gap, E3 validation benefit against nogram, and E1 validation benefit.</desc>
