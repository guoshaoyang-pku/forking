<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>v2 实验思维导图（E=3 固定 epoch）</title><style>body{margin:0;background:#fafaf7;display:flex;justify-content:center}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1660" height="1900" fill="#fafaf7"/><rect x="40" y="600" width="300" height="440" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="190.0" y="646" text-anchor="middle" font-size="23" font-weight="800" fill="#111">v2 主线</text><text x="62" y="692" font-size="16.5" font-weight="700" fill="#222">目标：OE 收益最大化</text>
<text x="62" y="724" font-size="16.5" font-weight="700" fill="#222">× forking 最小化</text>
<text x="62" y="756" font-size="16.5" fill="#222"></text>
<text x="62" y="788" font-size="16.5" fill="#b03a2e">外推目标 setting：</text>
<text x="62" y="820" font-size="16.5" fill="#222">恒定 D/N = 20。</text>
<text x="62" y="852" font-size="16.5" fill="#222">1B×20B → 100B×2T</text>
<text x="62" y="884" font-size="16.5" fill="#222">MoE 750B-A10B ×15–30T</text>
<text x="62" y="916" font-size="16.5" fill="#222"></text>
<text x="62" y="948" font-size="16.5" font-weight="700" fill="#1e8449">验收：E3 末尾 dVal &lt; 0</text>
<text x="62" y="980" font-size="16.5" fill="#555">（同 seed 配对 nogram）</text><rect x="400" y="60" width="380" height="1720" rx="14" fill="#fff" stroke="#111" stroke-width="2"/><text x="590.0" y="100" text-anchor="middle" font-size="19" font-weight="800" fill="#111">口径锁（不变量）</text><line x1="416" y1="118" x2="764" y2="118" stroke="#ccc" stroke-width="1.5"/><text x="420" y="152" font-size="16" font-weight="700" fill="#222">① 固定 epoch 数</text>
<text x="420" y="194" font-size="16" fill="#222">--train_epochs E。本梯 E=3</text>
<text x="420" y="236" font-size="16" fill="#222">launcher 默认 E=3，可覆写</text>
<text x="420" y="278" font-size="16" fill="#222">NGLAB_EPOCHS（不改代码）</text>
<text x="420" y="320" font-size="16" fill="#222"></text>
<text x="420" y="362" font-size="16" font-weight="700" fill="#222">② 验收位置 = E3 末尾</text>
<text x="420" y="404" font-size="16" fill="#222">末 60 行窗（每 10 步一记）</text>
<text x="420" y="446" font-size="16" fill="#222">同 seed 配对 nogram，同机</text>
<text x="420" y="488" font-size="16" fill="#222">Δval = arm − nogram</text>
<text x="420" y="530" font-size="16" fill="#1e8449">负 = 赢（验收通过）</text>
<text x="420" y="572" font-size="16" fill="#222"></text>
<text x="420" y="614" font-size="16" font-weight="700" fill="#222">③ 步数由池自动定</text>
<text x="420" y="656" font-size="16" fill="#222">steps = E × 池 / 总 batch</text>
<text x="420" y="698" font-size="16" fill="#222">17M: 6915 = 3 × 2305</text>
<text x="420" y="740" font-size="16" fill="#222"></text>
<text x="420" y="782" font-size="16" font-weight="700" fill="#222">④ D/N = 20</text>
<text x="420" y="824" font-size="16" fill="#222">（unique token 口径）</text>
<text x="420" y="866" font-size="16" fill="#222"></text>
<text x="420" y="908" font-size="16" font-weight="700" fill="#222">⑤ 表：exact 零碰撞</text>
<text x="420" y="950" font-size="16" fill="#222">R = 每阶行数 = distinct+1</text>
<text x="420" y="992" font-size="16" fill="#222">ρ = R / (N/1000)</text>
<text x="420" y="1034" font-size="16" fill="#222"></text>
<text x="420" y="1076" font-size="16" font-weight="700" fill="#222">⑥ 跨机门槛 = 语义量</text>
<text x="420" y="1118" font-size="16" fill="#222">min_count + R + counts</text>
<text x="420" y="1160" font-size="16" fill="#7d3c98">（不比 md5：两机来源不同）</text>
<text x="420" y="1202" font-size="16" fill="#222"></text>
<text x="420" y="1244" font-size="16" font-weight="700" fill="#222">⑦ 诊断 ≠ 验收</text>
<text x="420" y="1286" font-size="16" fill="#222">gap 只看方向与机制</text>
<text x="420" y="1328" font-size="16" fill="#1e8449">dVal 才是验收标准</text>
<text x="420" y="1370" font-size="16" fill="#222"></text>
<text x="420" y="1412" font-size="16" font-weight="700" fill="#222">⑧ run_id 约定</text>
<text x="420" y="1454" font-size="16" fill="#222">诊断臂带 _fd（fast-diag 管线）</text>
<text x="420" y="1496" font-size="16" fill="#222">改口径即新起 run_id</text><path d="M340,820.0 C370.0,820.0 370.0,920.0 400,920.0" fill="none" stroke="#111" stroke-width="3"/><text x="348" y="810.0" font-size="15" fill="#111" font-weight="700">先锁口径</text><rect x="840" y="60" width="720" height="320" rx="14" fill="#fff" stroke="#5b7a99" stroke-width="2"/><rect x="840" y="60" width="720" height="46" rx="14" fill="#5b7a99"/><rect x="840" y="84" width="720" height="22" fill="#5b7a99"/><text x="1200.0" y="91" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">输入｜已闭环的三条线</text><text x="866" y="142" font-size="16.5" fill="#222">线 A 机制 scaling（已发表）：扫 17→159M × 10–50M</text>
<text x="866" y="174" font-size="16.5" fill="#222">  → log gap = 2.01 + 0.108·logN − 0.170·logD</text>
<text x="866" y="206" font-size="16.5" fill="#222">线 B 配方×模型梯（§110–112）：钉 1B×E3 扫模型</text>
<text x="866" y="238" font-size="16.5" fill="#b03a2e">  → 159M 欠训 confound ⇒ 必须恒定 D/N</text>
<text x="866" y="270" font-size="16.5" fill="#222">判决线（§98–99/115）：adam+clip 救活发散臂</text>
<text x="866" y="302" font-size="16.5" fill="#222">  exact 零碰撞复活 E3 −0.035、零发散；PERM≈C3</text>
<text x="866" y="334" font-size="16.5" fill="#222">线 C 结构四格（§113–114）：OE×MoE 可加</text>
<text x="866" y="366" font-size="16.5" fill="#222">  moe_oe E3 2.4960 全局最优</text><path d="M780,920.0 C810.0,920.0 810.0,220.0 840,220.0" fill="none" stroke="#5b7a99" stroke-width="2"/><rect x="840" y="410" width="720" height="320" rx="14" fill="#fff" stroke="#b03a2e" stroke-width="2"/><rect x="840" y="410" width="720" height="46" rx="14" fill="#b03a2e"/><rect x="840" y="434" width="720" height="22" fill="#b03a2e"/><text x="1200.0" y="441" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">在扫｜iso-ratio 梯 + 剂量窗</text><text x="866" y="492" font-size="16.5" font-weight="700" fill="#222">扫：N=17/35/50/104/159M，D=20N，ρ=8/16/32</text>
<text x="866" y="524" font-size="16.5" fill="#222">固定：E=3、tls=1（除剂量窗）、同 seed 配对 nogram</text>
<text x="866" y="556" font-size="16.5" fill="#222">R 跟踪 N（r136k/r272k/r544k/r832k/r1272k）</text>
<text x="866" y="588" font-size="16.5" fill="#222">在跑（360-2 第三批 7 臂）：ρ=8 tls0.125</text>
<text x="866" y="620" font-size="16.5" fill="#222">  ρ=16 tls0.375/0.625；tls0.5 的 s44/s45 复本</text>
<text x="866" y="652" font-size="16.5" fill="#222">剂量窗：剂量 = Σ命中 × E × 6e-4·tls</text>
<text x="866" y="684" font-size="16.5" fill="#222">  ρ=8/16/32 @tls1 → 5.16 / 3.01 / 1.72</text>
<text x="866" y="716" font-size="16.5" font-weight="700" fill="#7d3c98">  ⇒ R/N 与 tls 是同一剂量的两个旋钮</text><path d="M780,920.0 C810.0,920.0 810.0,570.0 840,570.0" fill="none" stroke="#b03a2e" stroke-width="2"/><rect x="840" y="760" width="720" height="320" rx="14" fill="#fff" stroke="#1e8449" stroke-width="2"/><rect x="840" y="760" width="720" height="46" rx="14" fill="#1e8449"/><rect x="840" y="784" width="720" height="22" fill="#1e8449"/><text x="1200.0" y="791" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">判决｜本轮结果（E3 末尾读）</text><text x="866" y="842" font-size="16.5" font-weight="700" fill="#1e8449">104M 最干净：E3 val 平稳，2 seed 终局 −0.028/−0.038</text>
<text x="866" y="874" font-size="16.5" font-weight="700" fill="#1e8449">50M 可用：ρ=8 两 seed 终局 dGap +0.0670/+0.0674</text>
<text x="866" y="906" font-size="16.5" font-weight="700" fill="#b03a2e">17M 剔除：11 臂 done，E3 窗 4 seed 仅 1/4 通过</text>
<text x="866" y="938" font-size="16.5" fill="#222">  （−0.064 / +0.866 / +0.214 / +0.392）</text>
<text x="866" y="970" font-size="16.5" fill="#222">  ρ=8 无解：tls0.125 在 E1 即输（+0.064）</text>
<text x="866" y="1002" font-size="16.5" font-weight="700" fill="#b03a2e">35M 待审：台账 ρ=8 记 +49 mK 的那一臂</text>
<text x="866" y="1034" font-size="16.5" fill="#222">  = 被记「发散、final val 3.42」的同一臂</text>
<text x="866" y="1066" font-size="16.5" fill="#b03a2e">159M 剔除：每 epoch 末段 val 骤降-回爬</text><path d="M780,920.0 C810.0,920.0 810.0,920.0 840,920.0" fill="none" stroke="#1e8449" stroke-width="2"/><rect x="840" y="1110" width="720" height="320" rx="14" fill="#fff" stroke="#8e6e3a" stroke-width="2"/><rect x="840" y="1110" width="720" height="46" rx="14" fill="#8e6e3a"/><rect x="840" y="1134" width="720" height="22" fill="#8e6e3a"/><text x="1200.0" y="1141" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">外推｜能不能（分岔点）</text><text x="866" y="1192" font-size="16.5" font-weight="700" fill="#b03a2e">干净梯只剩 50M–104M（×2），35M 未审 ⇒ 现不能外推</text>
<text x="866" y="1224" font-size="16.5" fill="#222">分岔点：dGap 50M→104M 已持平（0.0670→0.0689）</text>
<text x="866" y="1256" font-size="16.5" fill="#222">  读作饱和 0.07 → 净收益 ≈30 mK 不消失</text>
<text x="866" y="1288" font-size="16.5" fill="#222">  读作 N^0.10 → 净收益在 N≈4.3B 归零</text>
<text x="866" y="1320" font-size="16.5" font-weight="700" fill="#7d3c98">  两读法都拟合现有 3 点 ⇒ 这才是分岔点</text>
<text x="866" y="1352" font-size="16.5" fill="#222">表 ∝ N^1.31：100B 按 ρ=8 约定 → 12 TB / 61×</text>
<text x="866" y="1384" font-size="16.5" fill="#222">  按固定 1M 词表 → ρ=0.01（低 800×）→ 趋零</text>
<text x="866" y="1416" font-size="16.5" font-weight="700" fill="#b03a2e">⇒ 模型规模不决定答案，「表开多大」决定</text><path d="M780,920.0 C810.0,920.0 810.0,1270.0 840,1270.0" fill="none" stroke="#8e6e3a" stroke-width="2"/><rect x="840" y="1460" width="720" height="320" rx="14" fill="#fff" stroke="#7d3c98" stroke-width="2" stroke-dasharray="7,5"/><rect x="840" y="1460" width="720" height="46" rx="14" fill="#7d3c98"/><rect x="840" y="1484" width="720" height="22" fill="#7d3c98"/><text x="1200.0" y="1491" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">下一步｜按依赖排序</text><text x="866" y="1542" font-size="16.5" fill="#222">S0 窗口口径审计（末 600 步 vs 末 60 行 vs 全 E3）</text>
<text x="866" y="1574" font-size="16.5" fill="#222">  → 修 35M，恢复 ×3 干净梯（外推前提）</text>
<text x="866" y="1606" font-size="16.5" fill="#222">S1 现有语料爬 200/300/400M（D/N=20、ρ=8/16、3 seed）</text>
<text x="866" y="1638" font-size="16.5" fill="#222">  ~13 H200-h/臂，8 卡 ~10 h → 跨度 ×2 拉到 ×11</text>
<text x="866" y="1670" font-size="16.5" fill="#222">S2 拿 20B unique → 1B×20B 锚点（本地 8B，差 2.5×）</text>
<text x="866" y="1702" font-size="16.5" fill="#222">S3 干预线（mask_low / freeze / count-init）@400M</text>
<text x="866" y="1734" font-size="16.5" fill="#222">  目标：把「被 gap 吃掉」的 64–80% 压下来</text>
<text x="866" y="1766" font-size="16.5" font-weight="700" fill="#b03a2e">  注意：ρ 与 tls 做不到这件事</text><path d="M780,920.0 C810.0,920.0 810.0,1620.0 840,1620.0" fill="none" stroke="#7d3c98" stroke-width="2"/><text x="858" y="400.0" font-size="15" font-weight="700" fill="#666">↓ 提供口径与 setting</text><text x="858" y="750.0" font-size="15" font-weight="700" fill="#666">↓ 产出判决</text><text x="858" y="1100.0" font-size="15" font-weight="700" fill="#666">↓ 决定能否外推</text><text x="858" y="1450.0" font-size="15" font-weight="700" fill="#666">↓ 据此排下一步</text><text x="830.0" y="1830" text-anchor="middle" font-size="15.5" fill="#555">图例：绿=已证实/通过，红=失效/卡点，紫=口径注意，虚线框=未跑或待审。左→右 = 主线 · 口径锁 · 分支，分支间 ↓ 为依赖。</text><text x="830.0" y="1860" text-anchor="middle" font-size="15.5" fill="#555">源：docs/experiment-log.md §110–§132(n)、data/runs_fixed/*_e3_fd_fixed、code/cluster/run_v26_dn20.sh（E=3 默认）。所有训练固定 epoch 数，验收一律读 E3 末尾。</text></svg></body></html>
