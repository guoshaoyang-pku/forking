<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1904" viewBox="0 0 1760 1904" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><rect width="1760" height="1904" fill="#fbfaf6"/><text x="40" y="52" font-size="28" font-weight="800" fill="#111">Forking v2 实验阵列（2026-10-22）</text><text x="40" y="86" font-size="17" fill="#555">验收：同预算、E3 末（第 3 遍末）的 Δval = nogram − OE（&gt;0 才算收益）；gap = val − train 只用来诊断。所有训练固定 epoch 数。</text><path d="M380,887.5 C400.0,887.5 400.0,153.0 420,153.0" fill="none" stroke="#7a7a7a" stroke-width="3"/><path d="M380,887.5 C400.0,887.5 400.0,530.0 420,530.0" fill="none" stroke="#1f5f8b" stroke-width="3"/><path d="M380,887.5 C400.0,887.5 400.0,985.0 420,985.0" fill="none" stroke="#a33b20" stroke-width="3"/><path d="M380,887.5 C400.0,887.5 400.0,1284.0 420,1284.0" fill="none" stroke="#2e6b3a" stroke-width="3"/><path d="M380,887.5 C400.0,887.5 400.0,1622.0 420,1622.0" fill="none" stroke="#6a4c93" stroke-width="3"/><path d="M750,153.0 C805.0,153.0 805.0,153.0 860,153.0" fill="none" stroke="#7a7a7a" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,257.0 860,257.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,335.0 860,335.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,413.0 860,413.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,491.0 860,491.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,569.0 860,569.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,647.0 860,647.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,725.0 860,725.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,530.0 C805.0,530.0 805.0,803.0 860,803.0" fill="none" stroke="#1f5f8b" stroke-width="1.6"/><path d="M750,985.0 C805.0,985.0 805.0,907.0 860,907.0" fill="none" stroke="#a33b20" stroke-width="1.6"/><path d="M750,985.0 C805.0,985.0 805.0,985.0 860,985.0" fill="none" stroke="#a33b20" stroke-width="1.6"/><path d="M750,985.0 C805.0,985.0 805.0,1063.0 860,1063.0" fill="none" stroke="#a33b20" stroke-width="1.6"/><path d="M750,1284.0 C805.0,1284.0 805.0,1167.0 860,1167.0" fill="none" stroke="#2e6b3a" stroke-width="1.6"/><path d="M750,1284.0 C805.0,1284.0 805.0,1245.0 860,1245.0" fill="none" stroke="#2e6b3a" stroke-width="1.6"/><path d="M750,1284.0 C805.0,1284.0 805.0,1323.0 860,1323.0" fill="none" stroke="#2e6b3a" stroke-width="1.6"/><path d="M750,1284.0 C805.0,1284.0 805.0,1401.0 860,1401.0" fill="none" stroke="#2e6b3a" stroke-width="1.6"/><path d="M750,1622.0 C805.0,1622.0 805.0,1505.0 860,1505.0" fill="none" stroke="#6a4c93" stroke-width="1.6"/><path d="M750,1622.0 C805.0,1622.0 805.0,1583.0 860,1583.0" fill="none" stroke="#6a4c93" stroke-width="1.6"/><path d="M750,1622.0 C805.0,1622.0 805.0,1661.0 860,1661.0" fill="none" stroke="#6a4c93" stroke-width="1.6"/><path d="M750,1622.0 C805.0,1622.0 805.0,1739.0 860,1739.0" fill="none" stroke="#6a4c93" stroke-width="1.6"/><rect x="40" y="821.5" width="340" height="132" rx="16" fill="#fff" stroke="#222" stroke-width="2.5"/><text x="210.0" y="857.5" text-anchor="middle" font-size="18" font-weight="600" fill="#666">第二阶段目标</text><text x="210.0" y="893.5" text-anchor="middle" font-size="24" font-weight="800" fill="#111">消除 forking 的危害</text><text x="210.0" y="929.5" text-anchor="middle" font-size="24" font-weight="800" fill="#111">只享受 OE 的收益</text><rect x="420" y="121.0" width="330" height="64" rx="14" fill="#7a7a7a"/><text x="585.0" y="160.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">0｜机制 why（已发表，结题）</text><rect x="420" y="498.0" width="330" height="64" rx="14" fill="#1f5f8b"/><text x="585.0" y="537.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1｜生产级会不会 fork：scaling</text><rect x="420" y="953.0" width="330" height="64" rx="14" fill="#a33b20"/><text x="585.0" y="992.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2｜消除危害，保住收益</text><rect x="420" y="1252.0" width="330" height="64" rx="14" fill="#2e6b3a"/><text x="585.0" y="1291.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3｜更好的 OE：分配与容量</text><rect x="420" y="1590.0" width="330" height="64" rx="14" fill="#6a4c93"/><text x="585.0" y="1629.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4｜蒸馏分组（Qwen3.5-4B 教师）</text><rect x="860" y="120" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="132" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="150" font-size="17" font-weight="700" fill="#151515">Good-Turing 缺失质量 + 概率挤出</text><text x="934" y="174" font-size="14" fill="#444">论文 arXiv:2610.00394；loss-mask 2% 上下文：gap 增长 1.018→0.007 nats</text><rect x="860" y="224" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="236" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="254" font-size="17" font-weight="700" fill="#151515">n / R / 数据包络 / 模型（§74–78）</text><text x="934" y="278" font-size="14" fill="#444">n≤5 幂律 R²≥0.84；「1B 时 forking 消失」= 只训 0.3 遍的伪影</text><rect x="860" y="302" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="314" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="331" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="332" font-size="17" font-weight="700" fill="#151515">val 泄漏审计（§137a）</text><text x="934" y="356" font-size="14" fill="#444">shard 61/64/65/66 含 2.5–7.6% val 原文 → 159M 的 −340 mK 是伪影；159M/200M 去片重跑</text><rect x="860" y="380" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="392" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="410" font-size="17" font-weight="700" fill="#151515">D/N 包络 5/10/20（§137b）</text><text x="934" y="434" font-size="14" fill="#444">E3 gap ∝ (D/N)^−1；E3 ΔVal 50M +17/+8/+34，104M −13/+19/+28 mK</text><rect x="860" y="458" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="470" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="488" font-size="17" font-weight="700" fill="#151515">R 下探到 R/N=0.12（§137c）</text><text x="934" y="512" font-size="14" fill="#444">R/N≤0.25 有害、2.5–16 平台、gap 在 R/N≈4 过零；V4.1 折算 R/N=0.1（总参）或 3–4（激活）</text><rect x="860" y="536" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="548" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="566" font-size="17" font-weight="700" fill="#151515">生产形态：1 遍里 10%/30% 子集重复 3 次</text><text x="934" y="590" font-size="14" fill="#444">子集上 train−val：OE +0.105/+0.119，nogram +0.025/+0.031；总 val 仍 +46–83 mK → 被平均稀释</text><rect x="860" y="614" width="860" height="66" rx="10" fill="#fff6e0" stroke="#c77700" stroke-width="2"/><rect x="872" y="626" width="50" height="24" rx="12" fill="#c77700"/><text x="897" y="643" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">在跑</text><text x="934" y="644" font-size="17" font-weight="700" fill="#151515">D/N=20 等比梯 35–200M（去泄漏）</text><text x="934" y="668" font-size="14" fill="#444">200M/159M _nl 四+二臂在 360-2；104M R/N=0.5/2 补点</text><rect x="860" y="692" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="704" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="722" font-size="17" font-weight="700" fill="#151515">D/N=40/80 + seed 复本 + 子集 3/4 遍</text><text x="934" y="746" font-size="14" fill="#444">外推 D/N 曲线需要右端实测点（A100 队列 Q1）</text><rect x="860" y="770" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="782" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="799" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="800" font-size="17" font-weight="700" fill="#151515">外推到 1B×20B / V4.1 两版</text><text x="934" y="824" font-size="14" fill="#444">三道墙：语料 7.8B、f30 索引 R/N=8 到 ≈200M、exact 表单卡到 ≈200M</text><rect x="860" y="874" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="886" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="903" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="904" font-size="17" font-weight="700" fill="#151515">低频 mask / 每阶只留高频 + 低表 LR（§82–89）</text><text x="934" y="928" font-size="14" fill="#444">128× 无收益；1–4× 时 f256@4× E3 −0.022、gap 0.02–0.04</text><rect x="860" y="952" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="964" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="981" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="982" font-size="17" font-weight="700" fill="#151515">表 LR 旋钮 tls + E5（§128–136）</text><text x="934" y="1006" font-size="14" fill="#444">gap ∝ tls^1.1；R/N=16 tls0.25 到 E5 健康；R/N=32 低 tls 也会在 E3–E5 发散</text><rect x="860" y="1030" width="860" height="66" rx="10" fill="#f1ecf8" stroke="#6a4c93" stroke-width="2"/><rect x="872" y="1042" width="50" height="24" rx="12" fill="#6a4c93"/><text x="897" y="1059" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">自做</text><text x="934" y="1060" font-size="17" font-weight="700" fill="#151515">可训练低频 gate f(n)（俞善斌）</text><text x="934" y="1084" font-size="14" fill="#444">合作者在训练；基线应为「mask + 低 tls」而非裸 mask</text><rect x="860" y="1134" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="1146" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="1163" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="1164" font-size="17" font-weight="700" fill="#151515">无碰撞词典 / keephash / W1 路由 / W2 聚类</text><text x="934" y="1188" font-size="14" fill="#444">收益来自覆盖率；128k 时没有路由胜过随机双 hash</text><rect x="860" y="1212" width="860" height="66" rx="10" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><rect x="872" y="1224" width="50" height="24" rx="12" fill="#2e7d32"/><text x="897" y="1241" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">已做</text><text x="934" y="1242" font-size="17" font-weight="700" fill="#151515">Step-2：dense/MoE × OE（50M）</text><text x="934" y="1266" font-size="14" fill="#444">收益可加，MoE 上的 OE 收益不随 epoch 衰减</text><rect x="860" y="1290" width="860" height="66" rx="10" fill="#fff6e0" stroke="#c77700" stroke-width="2"/><rect x="872" y="1302" width="50" height="24" rx="12" fill="#c77700"/><text x="897" y="1319" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">在跑</text><text x="934" y="1320" font-size="17" font-weight="700" fill="#151515">multi-head H=1/2/4/8（Engram 式，§137e）</text><text x="934" y="1344" font-size="14" fill="#444">同参数：1.6M 上下文进 400k 行 / 400k 进 400k；H4×tls4 对照 Engram 5× LR</text><rect x="860" y="1368" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="1380" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="1397" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="1398" font-size="17" font-weight="700" fill="#151515">FLAME 104M/159M + mHC；固定 wall-clock</text><text x="934" y="1422" font-size="14" fill="#444">最贵的一条，等 Q1/Q2 读数后再定</text><rect x="860" y="1472" width="860" height="66" rx="10" fill="#fff6e0" stroke="#c77700" stroke-width="2"/><rect x="872" y="1484" width="50" height="24" rx="12" fill="#c77700"/><text x="897" y="1501" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">在跑</text><text x="934" y="1502" font-size="17" font-weight="700" fill="#151515">10M 席位表构建：10B token，2–5gram</text><text x="934" y="1526" font-size="14" fill="#444">5B 里程碑强审通过（07:24）；n2/n3 各 2.25M、n4 2.04M、n5 0.89M 语义槽 + fallback</text><rect x="860" y="1550" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="1562" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="1579" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="1580" font-size="17" font-weight="700" fill="#151515">学生 harness（D0）</text><text x="934" y="1604" font-size="14" fill="#444">64 维 value + W_V + 标量 gate、depth 0/8/16/24、Qwen 词表 u32 数据、导出→assign 转换</text><rect x="860" y="1628" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="1640" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="1657" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="1658" font-size="17" font-weight="700" fill="#151515">四对照 + nogram（D1）</text><text x="934" y="1682" font-size="14" fill="#444">强多头 hash / 频率匹配随机分组 / 残差分组+随机 value / 残差分组+残差 value；E1 收益、E3 forking</text><rect x="860" y="1706" width="860" height="66" rx="10" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><rect x="872" y="1718" width="50" height="24" rx="12" fill="#9e9e9e"/><text x="897" y="1735" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">未做</text><text x="934" y="1736" font-size="17" font-weight="700" fill="#151515">A100 版：只在 depth 0 注入（D1a）</text><text x="934" y="1760" font-size="14" fill="#444">4 深度可训练表 2.56B 参数 ≈41GB 装不下 A100，depth-0 版 640M 可跑</text><text x="40" y="1869" font-size="15" fill="#444">图例：</text><rect x="96" y="1852" width="70" height="26" rx="8" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/><text x="131" y="1870" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">已做</text><rect x="182" y="1852" width="70" height="26" rx="8" fill="#fff6e0" stroke="#c77700" stroke-width="2"/><text x="217" y="1870" text-anchor="middle" font-size="14" font-weight="700" fill="#c77700">在跑</text><rect x="268" y="1852" width="70" height="26" rx="8" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="7,5"/><text x="303" y="1870" text-anchor="middle" font-size="14" font-weight="700" fill="#9e9e9e">未做</text><rect x="354" y="1852" width="70" height="26" rx="8" fill="#f1ecf8" stroke="#6a4c93" stroke-width="2"/><text x="389" y="1870" text-anchor="middle" font-size="14" font-weight="700" fill="#6a4c93">自做</text><text x="450" y="1870" font-size="14" fill="#666">mK = 0.001 nat；R/N = 每阶表行数 ÷ (参数量/1000)；tls = 表学习率 ÷ 主干学习率；§ = docs/experiment-log.md 小节</text></svg>